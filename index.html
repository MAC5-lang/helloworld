<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello, World!</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --fg: #1c1c1c;
      --muted: #666;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161616;
        --fg: #f2f2f0;
        --muted: #9a9a9a;
      }
    }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
      padding: 1rem;
      box-sizing: border-box;
    }
    h1 { font-size: clamp(2.5rem, 10vw, 5rem); margin: 0 0 0.5rem; }
    p { color: var(--muted); margin: 0; font-size: 1.1rem; }
  </style>
</head>
<body>
  <h1>Hello, World!</h1>
  <p>This page is hosted on GitHub Pages.</p>
</body>
</html>
